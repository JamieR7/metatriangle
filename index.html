<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB SEHS Triangle Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Difficulty Selection Screen -->
        <div id="difficulty-screen" class="screen active">
            <h1>IB SEHS Triangle Quiz</h1>
            <p class="subtitle">Test your Sports, Exercise & Health Science knowledge</p>
            <div class="difficulty-buttons">
                <button class="diff-btn" data-level="elite">Elite</button>
                <button class="diff-btn" data-level="varsity">Varsity</button>
                <button class="diff-btn" data-level="rookie">Rookie</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="game-header">
                <div class="score-display">Score: <span id="score">0</span></div>
                <div class="question-counter">Question <span id="current-q">1</span>/10</div>
                <div class="difficulty-badge" id="difficulty-badge">Elite</div>
            </div>

            <div class="question-area">
                <h2 id="question-text">Question will appear here</h2>
            </div>

            <div class="answers-area">
                <div class="answer-box" id="answer-0">Answer 1</div>
                <div class="answer-box" id="answer-1">Answer 2</div>
                <div class="answer-box" id="answer-2">Answer 3</div>
            </div>

            <div class="triangle-container">
                <p class="instruction">Click the triangle to indicate your confidence level</p>
                <div class="triangle-wrapper">
                    <img src="images/triangle.png" alt="Confidence Triangle" usemap="#triangle-map" id="triangle-image">
                    <map name="triangle-map">
                        <!-- Row 1 (Top) -->
                        <area shape="circle" coords="592,192,35" data-zone="top" alt="Top">
                        
                        <!-- Row 2 -->
                        <area shape="circle" coords="492,348,35" data-zone="top-left" alt="Top Left">
                        <area shape="circle" coords="692,348,35" data-zone="top-right" alt="Top Right">
                        
                        <!-- Row 3 -->
                        <area shape="circle" coords="392,512,35" data-zone="mid-left" alt="Mid Left">
                        <area shape="circle" coords="592,512,35" data-zone="center" alt="Center">
                        <area shape="circle" coords="792,512,35" data-zone="mid-right" alt="Mid Right">
                        
                        <!-- Row 4 -->
                        <area shape="circle" coords="292,688,35" data-zone="lower-left" alt="Lower Left">
                        <area shape="circle" coords="492,688,35" data-zone="lower-mid-left" alt="Lower Mid Left">
                        <area shape="circle" coords="692,688,35" data-zone="lower-mid-right" alt="Lower Mid Right">
                        <area shape="circle" coords="892,688,35" data-zone="lower-right" alt="Lower Right">
                        
                        <!-- Row 5 (Bottom) -->
                        <area shape="circle" coords="142,884,35" data-zone="bottom-left" alt="Bottom Left">
                        <area shape="circle" coords="342,884,35" data-zone="bottom-left-mid" alt="Bottom Left Mid">
                        <area shape="circle" coords="542,884,35" data-zone="bottom-center" alt="Bottom Center">
                        <area shape="circle" coords="742,884,35" data-zone="bottom-right-mid" alt="Bottom Right Mid">
                        <area shape="circle" coords="942,884,35" data-zone="bottom-right" alt="Bottom Right">
                    </map>
                    <div id="feedback-display" class="feedback"></div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h1>Quiz Complete!</h1>
            <div class="results-box">
                <p class="final-score">Final Score: <span id="final-score">0</span></p>
                <p class="accuracy">Accuracy: <span id="accuracy">0</span>%</p>
                <p class="performance-msg" id="performance-msg"></p>
            </div>
            <button id="restart-btn" class="restart-button">Try Again</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
