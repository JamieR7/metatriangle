<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB SEHS Triangle Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Difficulty Selection Screen -->
        <div id="difficulty-screen" class="screen active">
            <h1>IB SEHS Triangle Quiz</h1>
            <p class="subtitle">Test your Sports, Exercise & Health Science knowledge</p>
            <div class="difficulty-buttons">
                <button class="diff-btn" data-level="elite">Elite</button>
                <button class="diff-btn" data-level="varsity">Varsity</button>
                <button class="diff-btn" data-level="rookie">Rookie</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="game-header">
                <div class="score-display">Score: <span id="score">0</span></div>
                <div class="question-counter">Question <span id="current-q">1</span>/10</div>
                <div class="difficulty-badge" id="difficulty-badge">Elite</div>
            </div>

            <div class="question-area">
                <h2 id="question-text">Question will appear here</h2>
            </div>

            <div class="triangle-game-area">
                <!-- Top Answer (A) -->
                <div class="answer-box answer-top" id="answer-0">Answer 1</div>

                <div class="triangle-container">
                    <p class="instruction">Click a circle on the triangle to indicate your confidence level</p>
                    <div class="triangle-wrapper">
                        <img src="images/triangle.png" alt="Confidence Triangle" id="triangle-image">
                        
                        <!-- Clickable Circle Divs -->
                        <div class="click-circle" data-zone="top" style="top: 13.5%; left: 50%;"></div>
                        
                        <div class="click-circle" data-zone="top-left" style="top: 25.5%; left: 41.5%;"></div>
                        <div class="click-circle" data-zone="top-right" style="top: 25.5%; left: 58.5%;"></div>
                        
                        <div class="click-circle" data-zone="mid-left" style="top: 39.5%; left: 33.2%;"></div>
                        <div class="click-circle" data-zone="center" style="top: 39.5%; left: 50%;"></div>
                        <div class="click-circle" data-zone="mid-right" style="top: 39.5%; left: 66.8%;"></div>
                        
                        <div class="click-circle" data-zone="lower-left" style="top: 54%; left: 24.7%;"></div>
                        <div class="click-circle" data-zone="lower-mid-left" style="top: 54%; left: 41.5%;"></div>
                        <div class="click-circle" data-zone="lower-mid-right" style="top: 54%; left: 58.5%;"></div>
                        <div class="click-circle" data-zone="lower-right" style="top: 54%; left: 75.3%;"></div>
                        
                        <div class="click-circle" data-zone="bottom-left" style="top: 83.5%; left: 12%;"></div>
                        <div class="click-circle" data-zone="bottom-left-mid" style="top: 83.5%; left: 28.8%;"></div>
                        <div class="click-circle" data-zone="bottom-center" style="top: 83.5%; left: 45.8%;"></div>
                        <div class="click-circle" data-zone="bottom-right-mid" style="top: 83.5%; left: 62.7%;"></div>
                        <div class="click-circle" data-zone="bottom-right" style="top: 83.5%; left: 79.5%;"></div>
                        
                        <div id="feedback-display" class="feedback"></div>
                    </div>
                </div>

                <!-- Bottom Answers (B and C) -->
                <div class="answers-bottom">
                    <div class="answer-box answer-bottom-left" id="answer-1">Answer 2</div>
                    <div class="answer-box answer-bottom-right" id="answer-2">Answer 3</div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h1>Quiz Complete!</h1>
            <div class="results-box">
                <p class="final-score">Final Score: <span id="final-score">0</span></p>
                <p class="accuracy">Accuracy: <span id="accuracy">0</span>%</p>
                <p class="performance-msg" id="performance-msg"></p>
            </div>
            <button id="restart-btn" class="restart-button">Try Again</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
